apiVersion: apps/v1
kind: Deployment

metadata:
  name: event-management
  namespace: event-management

  labels:
    app.kubernetes.io/name: event-management
    app.kubernetes.io/component: backend

spec:

  replicas: 2

  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: event-management

  template:

    metadata:
      labels:
        app.kubernetes.io/name: event-management
        app.kubernetes.io/component: backend

    spec:

      terminationGracePeriodSeconds: 30

      containers:

        - name: event-management

          image: event-management:12

          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8084
              protocol: TCP

          envFrom:
            - secretRef:
                name: event-management-env

            - configMapRef:
                name: event-management-config

          resources:

            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
